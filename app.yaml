apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html
data:
  index.html: |
    <!doctype html>
    <html lang="es">
    <head><meta charset="utf-8"><title>GKE demo</title></head>
    <body style="font-family:sans-serif;text-align:center;margin-top:20vh">
      <h1>Hola desde GKE 🚀</h1>
      <p>Desplegado con Terraform + Kubernetes</p>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: html
              mountPath: /usr/share/nginx/html
      volumes:
        - name: html
          configMap:
            name: web-html
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  type: LoadBalancer
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
